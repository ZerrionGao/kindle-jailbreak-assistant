name: Feature request / 功能建议
description: Propose a focused improvement that preserves KJA's safety boundaries.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
      description: Describe the user problem before proposing an implementation.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Current upstream evidence / 当前上游证据
      description: Required for a new jailbreak method, package rule, or transport behavior.

  - type: textarea
    id: proposal
    attributes:
      label: Smallest useful change / 最小可用改动
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Safety and compatibility impact / 安全与兼容性影响
      description: Explain new writes, permissions, dependencies, or physical-device assumptions.
    validations:
      required: true
