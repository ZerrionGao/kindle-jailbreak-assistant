name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python:
          - "3.10"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Reject tracked local artifacts
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.DS_Store|__pycache__)(/|$)|\.py[co]$'; then
            echo "Generated or machine-local files must not be tracked."
            exit 1
          fi

      - name: Validate JSON policy files
        run: python -m json.tool kindle-jailbreak-assistant/references/method-policies.json

      - name: Compile Python sources
        run: python -m compileall -q kindle-jailbreak-assistant/scripts

      - name: Run offline self-test
        run: python kindle-jailbreak-assistant/scripts/kindle_jailbreak.py --json self-test

      - name: Run full POSIX test suite
        if: runner.os != 'Windows'
        env:
          PYTHONPATH: kindle-jailbreak-assistant/scripts
        run: python -m unittest discover -s kindle-jailbreak-assistant/tests -v

      - name: Run Windows test suite
        if: runner.os == 'Windows'
        working-directory: kindle-jailbreak-assistant/tests
        env:
          PYTHONPATH: ../scripts
        run: |
          python -m unittest -v test_models_session test_routing test_post_jailbreak
          python -m unittest -v test_device.WindowsMtpFixtureTest test_device.ProductionFixtureIsolationTest test_device.DeviceProbeTest.test_windows_combines_removable_volume_and_mtp_devices
          python -m unittest discover -s . -p "test_storage.py" -v -k windows
          python -m unittest -v test_cli.CLITest.test_self_test_uses_windows_policy_without_treating_temp_as_volume test_cli.CLITest.test_json_writer_falls_back_when_stdout_cannot_encode_chinese

      - name: Check Linux adapter syntax
        if: runner.os != 'Windows'
        shell: bash
        run: bash -n kindle-jailbreak-assistant/scripts/kindle_mtp_linux.sh
